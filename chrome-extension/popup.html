<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body {
    width: 280px; margin: 0; padding: 14px;
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #111318; color: #e8eaef;
  }
  h1 { font-size: 14px; margin: 0 0 2px; }
  .sub { color: #9aa1ad; font-size: 11.5px; margin: 0 0 12px; }
  button {
    display: block; width: 100%; margin: 0 0 8px; padding: 9px 12px;
    border: 0; border-radius: 8px; cursor: pointer;
    font: 600 13px system-ui, sans-serif;
    background: #4f6df5; color: #fff;
  }
  button.secondary { background: #262a33; color: #e8eaef; }
  label.row { justify-content: space-between; margin: 10px 0; }
  select {
    flex: 1; margin-left: 10px; padding: 5px 6px;
    background: #262a33; color: #e8eaef;
    border: 1px solid #363b47; border-radius: 6px;
    font: 12px system-ui, sans-serif;
  }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: .5; cursor: default; }
  label { display: flex; gap: 7px; align-items: center; margin: 10px 0 12px; color: #c3c8d2; user-select: none; }
  #status { min-height: 34px; font-size: 12px; color: #9aa1ad; white-space: pre-wrap; }
  #status.ok { color: #6fd08c; }
  #status.err { color: #ef7070; }
  .spin {
    display: inline-block; width: 11px; height: 11px; margin-right: 6px;
    border: 2px solid #4f6df5; border-top-color: transparent; border-radius: 50%;
    animation: r 0.8s linear infinite; vertical-align: -1px;
  }
  @keyframes r { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <h1>HTML to Figma</h1>
  <p class="sub">Capture this page as a <b>.h2f</b> file, then import it with the Figma plugin.</p>
  <label class="row">Width
    <select id="width">
      <option value="1920" selected>1920 &mdash; Desktop</option>
      <option value="1440">1440 &mdash; Laptop</option>
      <option value="1280">1280</option>
      <option value="1024">1024 &mdash; Tablet landscape</option>
      <option value="768">768 &mdash; Tablet</option>
      <option value="390">390 &mdash; Mobile</option>
      <option value="0">Current window size</option>
    </select>
  </label>
  <button id="full">Capture full page</button>
  <button id="viewport" class="secondary">Capture viewport only</button>
  <label><input type="checkbox" id="images" checked> Include images</label>
  <label><input type="checkbox" id="offscreen" checked> Include off-screen carousel slides</label>
  <div id="status">Chrome will show a &ldquo;debugging this browser&rdquo; bar while capturing at a fixed width. That is expected.</div>
  <script src="popup.js"></script>
</body>
</html>
